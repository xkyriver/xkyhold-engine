[package]
name = "xkyhold-secrets"
description = "XkyHold secrets in the system keyring: repository keys and the Google refresh token"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
keyring-core = "1"

[target.'cfg(not(windows))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[lints]
workspace = true
